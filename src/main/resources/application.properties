# Quelle der EPG-Daten (XMLTV, auch .gz). Spring-Resource-Syntax:
#   classpath:sample-epg.xml        -> Beispieldaten im Projekt
#   file:/pfad/zur/guide.xml        -> lokale Datei
#   https://beispiel.de/guide.xml   -> Download (Lizenz der Quelle beachten!)
epg.source=classpath:sample-epg.xml

# Täglicher Neuabruf um 04:00 Uhr (Spring-Cron: Sek Min Std Tag Monat Wochentag)
epg.refresh-cron=0 0 4 * * *

# Datumsfelder als ISO-String statt Zahlen-Array
spring.jackson.serialization.write-dates-as-timestamps=false
