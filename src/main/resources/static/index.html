<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TV-Programm</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2a6df4">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TV-Programm">
  <style>
    :root { color-scheme: light dark; --accent: #2a6df4; --muted: #888; --line: #8884; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 820px; margin: 0 auto; padding: 1rem; line-height: 1.4; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.4rem; margin: 0; }
    #install { padding: .35rem .7rem; font: inherit; font-size: .9rem; }
    .controls { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: 1rem; }
    .controls > * { font: inherit; padding: .4rem .6rem; }
    button { cursor: pointer; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
    button:hover { border-color: var(--accent); }
    button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    h2 { font-size: 1.05rem; margin: 1.5rem 0 .5rem; padding-bottom: .25rem; border-bottom: 1px solid var(--line); }
    .item { display: grid; grid-template-columns: 4.2rem 1fr; gap: .25rem .75rem; padding: .5rem 0; border-bottom: 1px solid var(--line); }
    .time { font-variant-numeric: tabular-nums; font-weight: 600; }
    .channelbar { position: sticky; top: 0; z-index: 10; display: flex; gap: .5rem; overflow-x: auto;
      padding: .5rem 0; margin-bottom: .75rem; background: Canvas; border-bottom: 1px solid var(--line);
      scrollbar-width: thin; }
    .chip { flex: 0 0 auto; padding: .4rem .9rem; font: inherit; border-radius: 999px; white-space: nowrap; }
    .title { font-weight: 600; }
    .meta { color: var(--muted); font-size: .85rem; }
    .desc { grid-column: 2; font-size: .9rem; }
    .status { color: var(--muted); padding: 1rem 0; }
    .error { color: #d33; }
    .more { display: block; width: 100%; padding: .5rem; margin-bottom: .75rem; font: inherit; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<div class="top">
  <h1>TV-Programm</h1>
  <button id="install" type="button" hidden>App installieren</button>
</div>

<nav id="channels" class="channelbar" aria-label="Sender"></nav>

<div class="controls">
  <button id="prev" title="Vorheriger Tag">&larr;</button>
  <input type="date" id="date">
  <button id="next" title="Nächster Tag">&rarr;</button>
  <button id="today">Heute</button>
  <button id="modeDay" class="active">Tag</button>
  <button id="modeWeek">Woche</button>
</div>

<button id="earlier" class="more" type="button" aria-expanded="false" hidden>Früheres Programm</button>

<div id="out" class="status">Lade …</div>

<script>
  const $ = id => document.getElementById(id);
  const state = { mode: 'day', channels: [], channel: null, showEarlier: false, data: null };

  // Standardmäßig werden nur Sendungen ab dieser Uhrzeit (deutsche Zeit) angezeigt.
  const FROM_HOUR = 20, FROM_MINUTE = 15;
  const FROM_LABEL = '20:15';

  const berlinToday = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Berlin' }); // YYYY-MM-DD

  function shiftDate(iso, days) {
    const d = new Date(iso + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + days);
    return d.toISOString().slice(0, 10);
  }

  const fmtTime = iso => new Date(iso).toLocaleTimeString('de-DE',
          { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Berlin' });

  const fmtDay = iso => new Date(iso + 'T12:00:00Z').toLocaleDateString('de-DE',
          { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });

  // Hilfsfunktion: Element mit Text bauen. textContent statt innerHTML,
  // weil die Programmdaten aus fremden Quellen stammen (XSS vermeiden).
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // Minuten seit Mitternacht (deutsche Zeit) zu einem Startzeitpunkt
  function berlinMinutes(iso) {
    const [h, m] = new Date(iso).toLocaleTimeString('de-DE',
            { hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: 'Europe/Berlin' })
            .split(':').map(Number);
    return h * 60 + m;
  }

  const isEarly = p => berlinMinutes(p.start) < FROM_HOUR * 60 + FROM_MINUTE;

  function render(byDay) {
    state.data = byDay; // merken, damit "Früheres Programm" ohne neuen Abruf umschalten kann
    const out = $('out');
    out.className = '';
    out.replaceChildren();
    const days = Object.keys(byDay).sort();
    const all = days.flatMap(d => byDay[d]);

    const btn = $('earlier');
    btn.hidden = !all.some(isEarly);
    btn.textContent = state.showEarlier ? 'Früheres Programm ausblenden' : 'Früheres Programm';
    btn.setAttribute('aria-expanded', String(state.showEarlier));

    if (all.length === 0) {
      out.className = 'status';
      out.textContent = 'Keine Sendungen für diesen Zeitraum.';
      return;
    }
    let shown = 0;
    for (const day of days) {
      const list = byDay[day]
              .filter(p => state.showEarlier || !isEarly(p))
              .sort((a, b) => a.start.localeCompare(b.start) || a.channelId.localeCompare(b.channelId));
      if (list.length === 0) continue;
      shown += list.length;
      out.append(el('h2', null, fmtDay(day)));
      for (const p of list) {
        const row = el('div', 'item');
        row.append(el('div', 'time', fmtTime(p.start)));
        const main = el('div');
        main.append(el('div', 'title', p.title));
        const meta = [p.subtitle, ...(p.categories || [])].filter(Boolean).join(' · ');
        if (meta) main.append(el('div', 'meta', meta));
        row.append(main);
        if (p.description) row.append(el('div', 'desc', p.description));
        out.append(row);
      }
    }
    if (shown === 0) {
      out.className = 'status';
      out.textContent = `Keine Sendungen ab ${FROM_LABEL} Uhr.`;
    }
  }

  async function load() {
    if (!state.channel) return;
    const out = $('out');
    out.className = 'status';
    out.textContent = 'Lade …';
    const date = $('date').value;
    const q = new URLSearchParams({ channel: state.channel });
    try {
      let byDay;
      if (state.mode === 'week') {
        q.set('from', date);
        q.set('days', '7');
        const res = await fetch('/api/programme/week?' + q);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        byDay = await res.json();
      } else {
        q.set('date', date);
        const res = await fetch('/api/programme?' + q);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        byDay = { [date]: await res.json() };
      }
      // Antwort verwerfen, falls inzwischen ein anderer Sender gewählt wurde (schnelles Klicken)
      if (q.get('channel') !== state.channel) return;
      render(byDay);
    } catch (e) {
      $('earlier').hidden = true;
      out.className = 'status error';
      out.textContent = 'Fehler beim Laden: ' + e.message;
    }
  }

  // --- Senderleiste ---

  function buildChannelBar() {
    const bar = $('channels');
    bar.replaceChildren();
    for (const c of state.channels) {
      const b = el('button', 'chip', c.name);
      b.type = 'button';
      b.dataset.id = c.id;
      b.onclick = () => selectChannel(c.id);
      bar.append(b);
    }
  }

  function markActiveChannel() {
    for (const b of $('channels').children) {
      const on = b.dataset.id === state.channel;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', String(on));
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    }
  }

  function selectChannel(id) {
    state.channel = id;
    markActiveChannel();
    try { localStorage.setItem('tv.channel', id); } catch (e) { /* optional */ }
    load();
  }

  function setMode(mode) {
    state.mode = mode;
    $('modeDay').classList.toggle('active', mode === 'day');
    $('modeWeek').classList.toggle('active', mode === 'week');
    load();
  }

  async function init() {
    $('date').value = berlinToday();

    const step = () => state.mode === 'week' ? 7 : 1;
    $('prev').onclick = () => { $('date').value = shiftDate($('date').value, -step()); load(); };
    $('next').onclick = () => { $('date').value = shiftDate($('date').value, step()); load(); };
    $('today').onclick = () => { $('date').value = berlinToday(); load(); };
    $('date').onchange = load;
    $('modeDay').onclick = () => setMode('day');
    $('modeWeek').onclick = () => setMode('week');
    $('earlier').onclick = () => {
      state.showEarlier = !state.showEarlier;
      if (state.data) render(state.data);
    };

    loadChannels();
  }

  // Senderliste holen und ersten (oder zuletzt gewählten) Sender anzeigen.
  // Ist der Server noch am Aufwachen oder lädt seine Programmdaten (kostenloser Render-Server),
  // kommt ein Fehler oder eine leere Liste: dann alle 5 Sekunden bis zu 3 Minuten lang neu versuchen.
  const RETRY_MS = 5000, MAX_RETRIES = 36;

  async function loadChannels(attempt = 0) {
    const out = $('out');
    const retry = text => {
      out.className = 'status';
      out.textContent = text;
      setTimeout(() => loadChannels(attempt + 1), RETRY_MS);
    };
    try {
      const res = await fetch('/api/channels');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      state.channels = await res.json();
    } catch (e) {
      if (attempt < MAX_RETRIES) return retry('Verbindung wird aufgebaut … einen Moment bitte.');
      out.className = 'status error';
      out.textContent = 'Senderliste konnte nicht geladen werden: ' + e.message;
      return;
    }
    if (state.channels.length === 0) {
      if (attempt < MAX_RETRIES) return retry('Programmdaten werden geladen … einen Moment bitte.');
      out.textContent = 'Keine Sender gefunden. Prüfe epg.source und epg.channels.';
      return;
    }
    buildChannelBar();
    let saved = null;
    try { saved = localStorage.getItem('tv.channel'); } catch (e) { /* optional */ }
    const start = state.channels.some(c => c.id === saved) ? saved : state.channels[0].id;
    selectChannel(start);
  }

  init();

  // --- App-Installation (PWA) ---

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => { /* ohne HTTPS nicht möglich, App läuft trotzdem */ });
    });
  }

  // Chrome/Edge/Samsung Internet melden, dass die Seite installierbar ist -> eigenen Button zeigen
  let installPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    installPrompt = e;
    $('install').hidden = false;
  });
  $('install').onclick = async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt = null;
    $('install').hidden = true;
  };
  window.addEventListener('appinstalled', () => { $('install').hidden = true; });
</script>
</body>
</html>
